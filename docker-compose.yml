version: '3.8'

services:
  # PostgreSQL for Temporal metadata
  postgresql:
    image: postgres:15
    container_name: debridge-postgres
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Temporal
  redis:
    image: redis:7-alpine
    container_name: debridge-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Temporal Server
  temporal:
    image: temporalio/auto-setup:1.20.0
    container_name: debridge-temporal
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=false
      - REDIS_SEEDS=redis:6379
    ports:
      - "7233:7233"
    volumes:
      - ./docker/temporal:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "workflow", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Temporal Web UI
  temporal-ui:
    image: temporalio/ui:2.10.0
    container_name: debridge-temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"

  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: debridge-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: debridge
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongodb/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ClickHouse
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: debridge-clickhouse
    environment:
      CLICKHOUSE_DB: debridge
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: debridge-app
    depends_on:
      mongodb:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/debridge?authSource=admin
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - TEMPORAL_ADDRESS=temporal:7233
      - PORT=3000
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./mock-data:/app/mock-data
    command: npm run dev

  # Temporal Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: debridge-worker
    depends_on:
      mongodb:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/debridge?authSource=admin
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - TEMPORAL_ADDRESS=temporal:7233
    volumes:
      - ./src:/app/src
    command: npm run worker

volumes:
  postgres_data:
  mongodb_data:
  clickhouse_data:
